trigger:
  branches:
    include:
      - main
  paths:
    include:
      - project/**
      - scripts/deploy-appservice.sh
      - azure-pipelines.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  GS_VERSION: '2.26.4'

steps:
  - checkout: self
    clean: true

  - task: AzureCLI@2
    displayName: Build and deploy GeoServer to App Service
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/deploy-appservice.sh
      workingDirectory: $(Build.SourcesDirectory)
      addSpnToEnvironment: false
    env:
      GS_VERSION: $(GS_VERSION)
      IMAGE_TAG: $(Build.SourceVersion)
      ACR_NAME: $(ACR_NAME)
      ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
      RESOURCE_GROUP: $(AZURE_RESOURCE_GROUP)
      WEBAPP_NAME: $(AZURE_WEBAPP_NAME)
      ADMIN_USER: $(GEOSERVER_ADMIN_USER)
      ADMIN_PASSWORD: $(GEOSERVER_ADMIN_PASSWORD)
      STORAGE_ACCOUNT: $(AZURE_STORAGE_ACCOUNT)
      STORAGE_KEY: $(AZURE_STORAGE_KEY)
      SHARE_DATA: $(AZURE_APPSERVICE_SHARE_DATA)
      SHARE_FONTS: $(AZURE_APPSERVICE_SHARE_FONTS)
      SHARE_CERTS: $(AZURE_APPSERVICE_SHARE_CERTS)
